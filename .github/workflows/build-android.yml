name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Gradle / Android 构建需要)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: 生成原生工程（若缺失）
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create --project-name printer_app --platforms=android,ios .
          fi

      - name: 应用权限补丁（mDNS 发现 + 微信分享）
        run: python3 tools/patch_permissions.py

      - name: Install dependencies
        run: flutter pub get

      - name: 兼容性修补 nsd_android 的 gradle（flutter.xxx 动态属性在旧 Flutter 下不可用）
        run: |
          F=$(ls ~/.pub-cache/hosted/pub.dev/nsd_android-*/android/build.gradle)
          sed -i \
            -e '/ndkVersion flutter.ndkVersion/d' \
            -e 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' \
            -e 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' \
            -e 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' \
            "$F"
          echo "patched: $F"
          grep -nE "SdkVersion|ndkVersion" "$F" || true

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
